version 13
bindings {
 keys {
 }
 pads {
 }
 mice {
 }
}
video {
 gl on
 width 256
 height 192
 aspect stretch
 scaling nearest
 scanlines off
 fullscreen off
 ntsc {
  overscan {
   top 27
   bottom 24
   left 13
   right 14
  }
 }
}
audio {
 rate 48000
 buffer 512
}
ui {
 screenshot_path /tmp/smsforge-blastem-native-review/focused_mutants/full_audit/wrong_vdp_site_pc/blastem-sms-selfcheck/screenshots
 screenshot_template frame_%Y%m%d_%H%M%S.png
 video_path /tmp/smsforge-blastem-native-review/focused_mutants/full_audit/wrong_vdp_site_pc/blastem-sms-selfcheck/media
 video_template native.apng
 audio_path /tmp/smsforge-blastem-native-review/focused_mutants/full_audit/wrong_vdp_site_pc/blastem-sms-selfcheck/media
 audio_template native.wav
 vgm_path /tmp/smsforge-blastem-native-review/focused_mutants/full_audit/wrong_vdp_site_pc/blastem-sms-selfcheck/media
 vgm_template native.vgm
 save_path /tmp/smsforge-blastem-native-review/focused_mutants/full_audit/wrong_vdp_site_pc/blastem-sms-selfcheck/saves
 remember_path off
 state_format native
}
system {
 sync_source audio
 ram_init zero
}
sms {
